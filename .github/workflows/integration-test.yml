name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  integration:
    name: Azure API Integration Tests
    runs-on: ubuntu-latest
    environment: azure-stt
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --group test
      - name: Run integration tests
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          AZURE_STT_REGION: ${{ secrets.AZURE_STT_REGION }}
        run: uv run pytest -m integration -v
